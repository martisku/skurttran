[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Korte lenker til hvert språk: skurtran.no/en → skurtran.no/?lang=en
[[redirects]]
  from = "/nb"
  to = "/?lang=nb"
  status = 302

[[redirects]]
  from = "/nn"
  to = "/?lang=nn"
  status = 302

[[redirects]]
  from = "/en"
  to = "/?lang=en"
  status = 302

[[redirects]]
  from = "/vi"
  to = "/?lang=vi"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
